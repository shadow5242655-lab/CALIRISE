name: Unzip Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip files
        run: unzip -o project.zip -d ./

      - name: Remove dangerous files
        run: |
          rm -f .env || true
          rm -rf .git || true

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Auto-extract website from zip" || echo "No changes to commit"
          git push


